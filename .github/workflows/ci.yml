name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22.x", "24.x"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm install

      - name: Typecheck and build
        run: npm run build

      - name: Test
        run: npm test

      - name: README test count still matches the suite
        run: node scripts/check-test-count.mjs

      - name: Verify the community build stays clean
        run: node scripts/build-public.mjs
