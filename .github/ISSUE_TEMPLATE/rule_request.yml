name: Rule request
description: An attack pattern the rule set does not cover yet
labels: [rule]
body:
  - type: markdown
    attributes:
      value: |
        A rule is worth adding when the pattern is specific enough to ban on. If a legitimate
        client can produce the same lines, say so — a rule that bans real users is worse than
        no rule.

  - type: input
    id: service
    attributes:
      label: Which service produces the logs
      placeholder: nginx, sshd, postfix, an application of your own
    validations:
      required: true

  - type: textarea
    id: lines
    attributes:
      label: Sample lines
      description: Several real lines from an actual attack, and one from ordinary traffic that must not match.
      render: text
    validations:
      required: true

  - type: textarea
    id: threshold
    attributes:
      label: When should it fire
      description: How many hits, over what window, and what should happen — score only, or a ban.
    validations:
      required: true
